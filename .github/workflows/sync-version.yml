name: Sync VERSION file

# When a release is published, write its tag (without the leading "v") into the
# repo's VERSION file so the installed tool reports the published release number.
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write VERSION from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$VERSION" > VERSION
          echo "VERSION set to $VERSION"

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- VERSION; then
            echo "VERSION already up to date; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: sync VERSION to ${GITHUB_REF_NAME}"
          git push origin HEAD:main
